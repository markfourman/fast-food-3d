<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fast Food 3D Playground</title>
<style>
:root{--a:#ffb347}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:ui-rounded,'SF Pro Rounded',Nunito,'Segoe UI',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 50% 35%,#3a1c5e,#14081f)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding:10px 14px 0;text-align:center;pointer-events:none}
header h1{font-size:19px;font-weight:900;letter-spacing:.6px;background:linear-gradient(90deg,#ffd34d,#ff6b6b,#c77dff,#4dd2ff,#7dff9b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0007)}
#name{font-size:22px;font-weight:900;margin-top:2px;text-shadow:0 3px 0 #0006}
#desc{font-size:13px;opacity:.9;margin-top:2px;min-height:16px;text-shadow:0 1px 0 #0008}
#snd{position:fixed;top:10px;left:10px;width:40px;height:40px;border:0;border-radius:50%;font-size:19px;background:#ffffff26;color:#fff;box-shadow:0 3px 0 #0005}
#price{position:fixed;top:92px;right:12px;background:#ffe14d;color:#3a1d00;font-weight:900;border-radius:14px;padding:5px 11px;font-size:15px;transform:rotate(5deg);border:3px solid #fff;box-shadow:0 4px 0 #0005}
#bites{position:fixed;top:132px;right:14px;font-size:14px;font-weight:800;text-shadow:0 2px 0 #0007}
#hint{position:fixed;top:96px;left:14px;font-size:12px;opacity:.7;max-width:150px;transition:opacity .6s}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:34px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 4px 0 #0008;white-space:nowrap}
#toast.show{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#dock{position:fixed;left:0;right:0;bottom:0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0008 35%)}
#menu{display:flex;gap:10px;overflow-x:auto;padding:6px 12px 14px;scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x}
#menu::-webkit-scrollbar{display:none}
.item{--c:#fb923c;--d:#8a3a08;--t:#fff;flex:0 0 auto;scroll-snap-align:center;width:84px;border:0;border-radius:18px;padding:9px 4px 8px;background:linear-gradient(160deg,var(--c),var(--d));color:var(--t);font-family:inherit;font-weight:900;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 5px 0 #0006,inset 0 2px 0 #fff5;transition:transform .12s}
.item span{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 #0004)}
.item:active{transform:translateY(3px)}
.item.on{transform:translateY(-6px) scale(1.08);outline:3px solid #fff;box-shadow:0 5px 0 #0006,0 0 24px var(--c);animation:wob 1.4s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-8px) scale(1.1) rotate(-2deg)}}
#tools{display:flex;gap:10px;justify-content:center;padding:0 12px}
.tool{--c1:#4dd2ff;--c2:#2a7bff;--sh:#1a46a8;flex:1;max-width:92px;height:60px;border:0;border-radius:18px;color:#fff;font-family:inherit;font-weight:900;font-size:12px;text-shadow:0 2px 0 #0004;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--sh),0 10px 16px #0007,inset 0 2px 0 #fff7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
.tool b{font-size:23px;line-height:1}
.tool:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sh),0 3px 8px #0007,inset 0 2px 0 #fff7}
.t-boom{--c1:#ffd34d;--c2:#ff3d3d;--sh:#a31818}
.t-drop{--c1:#e08bff;--c2:#7a3cff;--sh:#43198f}
.t-fresh{--c1:#9dff7d;--c2:#18c25b;--sh:#0b7a36}
.tool.on{outline:3px solid #fff;animation:pls 1s infinite}
@keyframes pls{50%{filter:brightness(1.3)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1>FAST FOOD 3D PLAYGROUND</h1><div id="name"></div><p id="desc"></p></header>
<button id="snd" aria-label="sound">🔊</button>
<div id="price"></div><div id="bites"></div><div id="toast"></div>
<div id="hint">drag to spin · pinch to zoom · tap food to bite</div>
<div id="dock">
  <div id="menu"></div>
  <div id="tools">
    <button class="tool" id="spin"><b>⟳</b>Spin</button>
    <button class="tool t-boom" id="explode"><b>💥</b><span>Explode</span></button>
    <button class="tool t-drop" id="drop"><b>⬇</b>Drop</button>
    <button class="tool t-fresh" id="reset"><b>♻</b>Fresh</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const MOBILE = matchMedia('(pointer:coarse)').matches;
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.position.set(0, 2.4, 4.6);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.autoRotate = false; controls.autoRotateSpeed = 0.5;

const sun = new THREE.DirectionalLight(0xfff1dd, 2.4);
sun.position.set(3, 6, 3); sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 512 : 1024, MOBILE ? 512 : 1024);
Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5 });
sun.shadow.radius = 6; scene.add(sun);
const rim = new THREE.DirectionalLight(0xff66aa, 1.6); rim.position.set(-4, 3, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffe8cc, 0x2a1a10, 0.5));

const table = new THREE.Mesh(new THREE.CircleGeometry(3.4, 64), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
let tableTex = null;
function setTable(c1, c2) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const x = cv.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, 256, 256);
  x.globalAlpha = 0.55; x.fillStyle = c2;
  for (let i = 0; i < 4; i++) { x.fillRect(i * 64, 0, 32, 256); x.fillRect(0, i * 64, 256, 32); }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (tableTex) tableTex.dispose();
  tableTex = t; table.material.map = t; table.material.needsUpdate = true;
}

/* ---------- sound (tiny synth) ---------- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(f, dur = 0.12, type = 'sine', vol = 0.15, slide = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), a.currentTime + dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);

function noiseBurst(dur = 0.15, vol = 0.2, freq = 1200) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  pick: () => blip(520, 0.1, 'triangle', 0.12, 300),
  bite: () => { noiseBurst(0.12, 0.25, 2500); blip(180, 0.12, 'square', 0.06, -80); },
  boom: () => { noiseBurst(0.5, 0.4, 500); blip(120, 0.4, 'sine', 0.3, -80); },
  thud: () => blip(90 + Math.random() * 60, 0.07, 'sine', 0.1, -30),
  pop: () => blip(700, 0.08, 'sine', 0.12, 400),
  combo: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.12, 'triangle', 0.12), i * 70)),
};

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
function noise(x, y, z) {
  return (Math.sin(x * 3.1 + y * 1.7) * Math.cos(z * 2.3 - x * 1.3) +
    Math.sin(y * 5.3 + z * 4.1) * 0.5 + Math.sin(x * 9.7 + z * 8.3 + y * 7.1) * 0.25) / 1.75;
}
function mergeVerts(geo) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', geo.attributes.position);
  return mergeVertices(g, 1e-4);
}
// displace along normal + paint vertex colours
function shape(geo, dispFn, colorFn) {
  geo = geo.index ? geo.toNonIndexed() : geo;
  geo = mergeVerts(geo); geo.computeVertexNormals();
  const p = geo.attributes.position, n = geo.attributes.normal;
  const col = new Float32Array(p.count * 3), v = new THREE.Vector3(), nn = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); nn.fromBufferAttribute(n, i);
    if (dispFn) { const d = dispFn(v, nn); v.addScaledVector(nn, d); p.setXYZ(i, v.x, v.y, v.z); }
    if (colorFn) { colorFn(v, nn, c); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
  }
  if (colorFn) geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  return geo;
}
// transmission is slow on phones -> cheap see-through instead
const mat = (o) => {
  o = Object.assign({ roughness: 0.6 }, o);
  if (o.transmission) {
    const t = o.transmission; delete o.transmission; delete o.thickness; delete o.ior;
    if (t > 0.4) { o.transparent = true; o.opacity = 0.35; o.depthWrite = false; o.clearcoat = 1; o.clearcoatRoughness = 0.05; }
  }
  return new THREE.MeshPhysicalMaterial(o);
};
const vmat = (o) => mat(Object.assign({ vertexColors: true, color: 0xffffff }, o));
function mesh(geo, m, parent) {
  const me = new THREE.Mesh(geo, m); me.castShadow = me.receiveShadow = true; parent.add(me); return me;
}
function scatter(parent, count, makeGeo, m, placeFn, colorFn) {
  const im = new THREE.InstancedMesh(makeGeo(), m, count), o = new THREE.Object3D(), c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    o.position.set(0, 0, 0); o.quaternion.identity(); o.scale.set(1, 1, 1);
    placeFn(o, i); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    if (colorFn) { colorFn(i, c); im.setColorAt(i, c); }
  }
  im.castShadow = im.receiveShadow = true; parent.add(im); return im;
}
const lerpC = (a, b, t, out) => out.set(a).lerp(new THREE.Color(b), THREE.MathUtils.clamp(t, 0, 1));
const PALETTE = [0xff4d6d, 0xffd34d, 0x4dd2ff, 0x7dff9b, 0xc77dff, 0xff9f43];

/* ---------- PARODY BRANDING (original designs, typo names) ---------- */
const BRANDS = {
  hotdog:  { name: 'BOSTCO', sub: 'Wholesail · Food Court', bg: '#1d4f9c', fg: '#fff', accent: '#e3262f' },
  whopper: { name: 'BURGER KLING', sub: 'Home of the Whooper', bg: '#f4e2c4', fg: '#7a2a10', accent: '#e8721c' },
  pizza:   { name: "FATHER JONATHAN'S", sub: 'Better Dough. Better Pizza-ish.', bg: '#0f5a3a', fg: '#fff', accent: '#d42a2a' },
  fritter: { name: 'COUNTREE STYLE', sub: 'Donuts · Since Forever', bg: '#fff6e5', fg: '#b3261e', accent: '#2f6b3a' },
  csbagel: { name: 'COUNTREE STYLE', sub: 'Fresh Bagels Daily', bg: '#fff6e5', fg: '#b3261e', accent: '#2f6b3a' },
  wobagel: { name: 'WOOD OVEN', sub: 'Fire-Baked Bagel Co.', bg: '#2a1a12', fg: '#f3c27a', accent: '#d9632b' },
  poutine: { name: 'ST. LEWIS WINGZ', sub: 'Bar & Grille', bg: '#111', fg: '#ffd400', accent: '#e02424' },
  latte:   { name: "DIPPIN'", sub: 'Donuts & Coffee Runs', bg: '#fff', fg: '#ff6f1f', accent: '#e8338a' },
  chicken: { name: 'POPEYEZ', sub: 'Louisiana-ish Chicken', bg: '#ff7a1a', fg: '#fff', accent: '#7a1d0f' },
  sushi:   { name: 'SANNO SUSHI', sub: 'Fresh · Fast · Rolled', bg: '#f7f0e4', fg: '#c4161c', accent: '#111' },
  nuggets: { name: 'MCDOUGALDS', sub: 'Nugget Time™', bg: '#d7141a', fg: '#ffcb05', accent: '#ffcb05' },
};
function logoTex(b, w = 1024, h = 512) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
  x.fillStyle = b.bg; x.fillRect(0, 0, w, h);
  x.fillStyle = b.accent; x.fillRect(0, h * 0.78, w, h * 0.08); x.fillRect(0, h * 0.06, w, h * 0.03);
  x.fillStyle = b.fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = 190; x.font = `900 ${fs}px Impact, 'Arial Black', sans-serif`;
  while (x.measureText(b.name).width > w * 0.9 && fs > 20) { fs -= 8; x.font = `900 ${fs}px Impact, 'Arial Black', sans-serif`; }
  x.fillText(b.name, w / 2, h * 0.42);
  x.font = `italic 600 ${Math.round(h * 0.09)}px Georgia, serif`; x.fillText(b.sub, w / 2, h * 0.66);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function addBranding(g, k) {
  const b = BRANDS[k], tex = logoTex(b);
  const card = new THREE.Group();
  const face = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 });
  for (const s of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), face);
    p.position.z = s * 0.12; p.rotation.x = s * -0.33; if (s < 0) p.rotation.y = Math.PI;
    p.castShadow = true; card.add(p);
  }
  card.position.set(0, 0.34, -2.1); scene.add(card); g.userData.extras.push(card);
  if (k === 'pizza') {
    const cardboard = new THREE.MeshStandardMaterial({ color: 0xcfa874, roughness: 0.9 });
    const base = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.08, 3.9), cardboard); base.position.y = -0.035; base.receiveShadow = true;
    const lid = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.04, 3.9),
      [cardboard, cardboard, new THREE.MeshStandardMaterial({ map: logoTex(b, 1024, 1024), roughness: 0.7 }), cardboard, cardboard, cardboard]);
    lid.geometry.translate(0, 0, -1.95); lid.position.set(0, 0.04, -1.95); lid.rotation.x = -1.25;
    const box = new THREE.Group(); box.add(base, lid); scene.add(box); g.userData.extras.push(box);
    card.visible = false;
  }
  if (k === 'latte') {
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.575, 0.7, 64, 1, true),
      new THREE.MeshStandardMaterial({ map: logoTex(b, 2048, 512), roughness: 0.8, side: THREE.DoubleSide }));
    sleeve.position.y = 1.15; sleeve.castShadow = true; g.add(sleeve);
  }
  if (k === 'whopper' || k === 'hotdog' || k === 'chicken') {
    const t = logoTex(b, 1024, 1024); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2, 20, 20), new THREE.MeshStandardMaterial({ map: t, roughness: 0.75, side: THREE.DoubleSide }));
    const pp = paper.geometry.attributes.position;
    for (let i = 0; i < pp.count; i++) pp.setZ(i, Math.sin(pp.getX(i) * 3) * Math.cos(pp.getY(i) * 2.5) * 0.04 + Math.max(0, Math.hypot(pp.getX(i), pp.getY(i)) - 1.3) * 0.25);
    paper.geometry.computeVertexNormals(); paper.rotation.x = -Math.PI / 2; paper.rotation.z = 0.4; paper.position.y = 0.01; paper.receiveShadow = true;
    scene.add(paper); g.userData.extras.push(paper);
  }
  if (k === 'poutine') {
    const band = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.02, 0.25, 64, 1, true),
      new THREE.MeshStandardMaterial({ map: logoTex(b, 2048, 512), roughness: 0.4, side: THREE.DoubleSide }));
    band.position.y = 0.28; g.add(band);
  }
}

function seeds(g, R, r, sy, n, col, y, dense) {
  scatter(g, n, () => new THREE.SphereGeometry(0.028, 8, 6).scale(1, 0.4, 0.55), mat({ color: col, roughness: 0.5 }), (o) => {
    const u = rnd(0, Math.PI * 2), v = rnd(-Math.PI / 2 * (dense ? 1 : 0.8), Math.PI / 2 * (dense ? 1 : 0.8));
    const nx = Math.cos(v) * Math.cos(u), ny = Math.sin(v), nz = Math.cos(v) * Math.sin(u);
    o.position.set((R + r * Math.cos(v)) * Math.cos(u), y + r * Math.sin(v) * sy + 0.01, (R + r * Math.cos(v)) * Math.sin(u));
    o.lookAt(o.position.x + nx, o.position.y + ny, o.position.z + nz); o.rotateZ(rnd(0, 3));
  });
}
function crown(g, y, R, sy, seedsOn, top) {
  const geo = shape(new THREE.SphereGeometry(R, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), (v) => noise(v.x * 3, v.y * 3, v.z * 3) * 0.015,
    (v, n, c) => lerpC(top || 0xf3d7a0, 0xa9541c, n.y * 1.3 - 0.1, c));
  geo.scale(1, sy, 1);
  const m = mesh(geo, vmat({ roughness: 0.5, clearcoat: 0.4, clearcoatRoughness: 0.3, sheen: 0.5, sheenColor: 0xffd9a0, side: THREE.DoubleSide }), g);
  m.position.y = y;
  if (seedsOn) scatter(m, 140, () => new THREE.SphereGeometry(0.03, 8, 6).scale(1, 0.4, 0.55), mat({ color: 0xf5ead0, roughness: 0.5 }), (o) => {
    const th = rnd(0, Math.PI * 2), ph = Math.acos(rnd(0.25, 1));
    o.position.set(Math.sin(ph) * Math.cos(th) * R, Math.cos(ph) * R * sy, Math.sin(ph) * Math.sin(th) * R);
    o.lookAt(o.position.clone().multiplyScalar(2)); o.rotateZ(rnd(0, 3));
  });
  return m;
}
const poolGeo = (r, h) => new THREE.CylinderGeometry(r, r, h, 40);

/* ---------- FOODS (part 1) ---------- */
const FOODS = {};
FOODS.hotdog = {
  name: 'Bostco $1.50 Hot Dog', short: 'Bostco Dog', icon: '🌭', price: '$1.50', hot: true, cam: 4.4,
  desc: 'Quarter-pound dog + soft bun. Combo includes a pop, legally.',
  theme: { bg1: '#2f6be0', bg2: '#0a1a40', t1: '#eef3ff', t2: '#5b8cff', c: '#2f6fe0', d: '#173f94' },
  build(g) {
    for (const s of [-1, 1]) {
      const geo = shape(new THREE.CapsuleGeometry(0.32, 1.9, 12, 32), (v) => noise(v.x * 2, v.y * 2, v.z * 2) * 0.012,
        (v, n, c) => lerpC(0xf6dba6, 0xb8692a, n.x * 0.8 + 0.2 + (Math.abs(v.y) > 1 ? 0.2 : 0), c));
      geo.rotateZ(Math.PI / 2); geo.scale(1, 0.75, 1);
      const m = mesh(geo, vmat({ roughness: 0.75, sheen: 0.6, sheenColor: 0xffe2b0 }), g);
      m.position.set(0, 0.25, s * 0.2); m.scale.z = 0.62;
    }
    const dg = shape(new THREE.CapsuleGeometry(0.17, 2.15, 10, 32), null, (v, n, c) => {
      const mark = Math.abs(Math.sin(v.y * 13)) > 0.88 && n.x > 0.25;
      lerpC(0xc2452a, 0x7a2514, mark ? 1.2 : 0.2 + n.x * 0.2, c);
    });
    dg.rotateZ(Math.PI / 2);

  document.body.style.background = `radial-gradient(circle at 50% 35%, ${t.bg1}, ${t.bg2})`;
  document.documentElement.style.setProperty('--a', t.c); setTable(t.t1, t.t2); rim.color.set(t.c);
  [...menu.children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  current.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(current), size = box.getSize(new THREE.Vector3());
  steamSrc = { on: !!f.hot, y: Math.max(0.5, box.max.y), r: Math.max(0.3, Math.min(size.x, size.z) * 0.25) };
  const tgt = new THREE.Vector3(0, Math.max(0.3, size.y / 2), 0), dist = (f.cam || 4.6) * (MOBILE ? 1.1 : 1);
  camera.position.sub(controls.target).setLength(dist).add(tgt); controls.target.copy(tgt);
  if (celebrate) confetti(new THREE.Vector3(0, tgt.y + 0.5, 0), 40);
}
const spinBtn = $('spin');
spinBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; spinBtn.classList.toggle('on', controls.autoRotate); sfx.pop(); };
explodeBtn.onclick = () => { if (phys === 'blast') rebuild(); else blast(); };
let dropV = 0, dropping = false;
$('drop').onclick = () => { if (phys !== 'idle') snapHome(); current.position.y = 2.6; dropV = 0; dropping = true; };
$('reset').onclick = () => { sfx.pop(); load(key, true); };
$('snd').onclick = () => { muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊'; if (!muted) sfx.pop(); };

/* ---------- bite ---------- */
const _inv = new THREE.Matrix4();
function carve(m, p, wn, r) {
  const geo = m.geometry, pos = geo.attributes.position; if (!pos) return;
  const loc = m.worldToLocal(p.clone());
  if (!geo.boundingSphere) geo.computeBoundingSphere();
  const sc = m.getWorldScale(new THREE.Vector3()), lr = r / ((sc.x + sc.y + sc.z) / 3);
  if (loc.distanceTo(geo.boundingSphere.center) > geo.boundingSphere.radius + lr) return;
  const n = wn.clone().transformDirection(_inv.copy(m.matrixWorld).invert());
  const colA = geo.attributes.color, v = new THREE.Vector3(), d = new THREE.Vector3(), cc = new THREE.Color(), inner = new THREE.Color(0xfbeccb);
  let changed = false;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i); d.subVectors(v, loc); const dist = d.length(); if (dist >= lr) continue;
    d.addScaledVector(n, -d.dot(n));
    const h = Math.sqrt(Math.max(0, lr * lr - d.lengthSq())) * (0.85 + 0.15 * Math.sin(i * 12.9898));
    v.copy(loc).add(d).addScaledVector(n, -h); pos.setXYZ(i, v.x, v.y, v.z); changed = true;
    if (colA) { cc.fromBufferAttribute(colA, i).lerp(inner, (1 - dist / lr) * 0.85); colA.setXYZ(i, cc.r, cc.g, cc.b); }
  }
  if (changed) { pos.needsUpdate = true; if (colA) colA.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere(); }
}
function bite(hit) {
  const p = hit.point, r = 0.4;
  const wn = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
  current.traverse(m => {
    if (m.isInstancedMesh) {
      const mt = new THREE.Matrix4(), v = new THREE.Vector3(), zero = new THREE.Matrix4().makeScale(0, 0, 0);
      for (let i = 0; i < m.count; i++) { m.getMatrixAt(i, mt); v.setFromMatrixPosition(mt).applyMatrix4(m.matrixWorld); if (v.distanceTo(p) < r) m.setMatrixAt(i, zero); }
      m.instanceMatrix.needsUpdate = true;
    } else if (m.isMesh) carve(m, p, wn, r);
  });
  const bites = (current.userData.bites || 0) + 1; current.userData.bites = bites;
  $('bites').textContent = `🦷 ${bites}`; sfx.bite(); crumbs(p); if (navigator.vibrate) navigator.vibrate(25);
  $('desc').textContent = ['Nom.', 'Nom nom.', 'Still going…', 'Respect.', 'You okay?', 'Legend.'][Math.min(bites - 1, 5)];
  if (bites % 5 === 0) { confetti(p, 60); sfx.combo(); toast(`COMBO ×${bites / 5}! 🎉`); }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null, stir = 0;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY, performance.now()]; ac(); $('hint').style.opacity = 0; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8 || performance.now() - downAt[2] > 350) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  camera.updateMatrixWorld(); ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObject(current, true); if (!hits.length) return;
  if (phys !== 'idle') poke(hits[0]);
  else if (key === 'latte') { stir = 1; sfx.pop(); }
  else bite(hits[0]);
});

/* ---------- loop ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight;
  camera.setViewOffset(innerWidth, innerHeight, 0, Math.round(innerHeight * 0.07), innerWidth, innerHeight); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (phys === 'blast' && !settled) stepBodies(dt); else if (phys === 'back') stepBack(dt);
  if (dropping) {
    dropV -= 14 * dt; current.position.y += dropV * dt;
    if (current.position.y < 0) { current.position.y = 0; if (Math.abs(dropV) > 1) { dropV = -dropV * 0.35; sfx.thud(); } else { dropV = 0; dropping = false; } }
    const sq = current.position.y === 0 && dropV !== 0 ? 0.85 : 1; current.scale.set(2 - sq, sq, 2 - sq);
  } else if (current.scale.y !== 1) { current.scale.lerp(new THREE.Vector3(1, 1, 1), dt * 10); }
  if (key === 'latte' && stir > 0) {
    stir -= dt * 0.5;
    for (const n of ['ice', 'liquid', 'loops']) { const o = current.getObjectByName(n); if (o) o.rotation.y += dt * 5 * stir; }
  }
  updateConfetti(dt); updateCrumbs(dt); updateSteam(dt);
  controls.update(); renderer.render(scene, camera);
});
load('hotdog');
const idle = window.requestIdleCallback || ((f) => setTimeout(f, 200));
const queue = Object.keys(FOODS).filter(k => k !== 'hotdog');
(function precook() { const k = queue.shift(); if (!k) return; idle(() => { if (!cache[k]) cache[k] = build(k); precook(); }); })();
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); $('desc').textContent = 'Graphics reset, reload the page'; });
window.__ff = { scene, camera, load, FOODS, bite, blast, rebuild, getCurrent: () => current, getPhys: () => phys, step: (n) => { for (let i = 0; i < n; i++) { if (phys === 'blast' && !settled) stepBodies(0.016); else if (phys === 'back') stepBack(0.016); } } };
</script>
